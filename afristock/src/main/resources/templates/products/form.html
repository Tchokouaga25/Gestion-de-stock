<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: pageHead(${product.id == null} ? 'Nouveau produit — Afristock' : 'Modifier le produit — Afristock')}"></head>
<body class="flex">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main id="main-content" class="ml-[260px] flex-1 p-10">
    <div th:fragment="content" th:data-title="${product.id == null} ? 'Nouveau produit — Afristock' : 'Modifier le produit — Afristock'" class="max-w-3xl mx-auto">

        <!-- Barre d'outils globale (recherche, aide, notifications, avatar) -->
        <div class="flex justify-end mb-6">
            <div th:replace="~{fragments/layout :: topbarControls(null, null)}"></div>
        </div>
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900"
                th:text="${product.id == null} ? 'Nouveau produit' : 'Modifier le produit'">Produit</h1>
        </header>

        <form th:action="@{/products/save}" th:object="${product}" method="post"
              class="card p-8 space-y-8">
            <input type="hidden" th:field="*{id}"/>

            <div class="flex items-center justify-between p-4 rounded-2xl bg-gray-50">
                <div>
                    <p class="text-[13px] font-bold text-gray-900">Produit actif</p>
                    <p class="text-12 text-gray-500 mt-0.5">Un produit inactif disparaît des ventes et achats mais reste visible dans l'historique.</p>
                </div>
                <label class="switch">
                    <input type="checkbox" th:field="*{active}"/>
                    <span class="switch-track"></span>
                </label>
            </div>

            <div class="space-y-4">
                <h3 class="text-[13px] font-bold text-gray-900 uppercase tracking-wide">Identification</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Référence</label>
                        <input type="text" th:field="*{reference}" required class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">Nom</label>
                        <input type="text" th:field="*{name}" required class="form-input"/>
                    </div>
                </div>
                <div>
                    <label class="form-label">Description</label>
                    <input type="text" th:field="*{description}" class="form-input"/>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Code-barres</label>
                        <input type="text" th:field="*{barcode}" class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">URL de l'image</label>
                        <input type="text" th:field="*{imageUrl}" class="form-input"/>
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-6 border-t border-gray-100">
                <h3 class="text-[13px] font-bold text-gray-900 uppercase tracking-wide">Classification</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="form-label">Catégorie</label>
                        <select name="categoryId" required class="form-input">
                            <option value="">— Choisir —</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                                    th:selected="${product.category != null and product.category.id == c.id}">Cat</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Marque (optionnel)</label>
                        <select name="brandId" class="form-input">
                            <option value="">— Aucune —</option>
                            <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                                    th:selected="${product.brand != null and product.brand.id == b.id}">Marque</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Unité</label>
                        <select th:field="*{unit}" class="form-input">
                            <option th:each="u : ${units}" th:value="${u}" th:text="${u}">Unité</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-6 border-t border-gray-100">
                <h3 class="text-[13px] font-bold text-gray-900 uppercase tracking-wide">Tarification</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="form-label">Prix d'achat</label>
                        <input type="number" min="0" step="0.01" th:field="*{purchasePrice}" class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">Prix vente détail</label>
                        <input type="number" min="0" step="0.01" th:field="*{salePrice}" required class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">Prix vente gros (optionnel)</label>
                        <input type="number" min="0" step="0.01" th:field="*{wholesalePrice}" class="form-input"/>
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-6 border-t border-gray-100">
                <h3 class="text-[13px] font-bold text-gray-900 uppercase tracking-wide">Stock</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label" th:text="${product.id == null} ? 'Quantité initiale' : 'Quantité en stock'">Quantité</label>
                        <input type="number" min="0" th:field="*{currentQuantity}" class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">Seuil d'alerte</label>
                        <input type="number" min="0" th:field="*{minThreshold}" class="form-input"/>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/products}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
    </main>
</body>
</html>
