services:
  - type: web
    name: afristock
    runtime: java
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/afristock-0.0.1-SNAPSHOT.jar --server.port=$PORT
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false   # à remplir dans le dashboard Render avec la "JDBC Connection String" de la base
      - key: SPRING_DATASOURCE_USERNAME
        sync: false   # ex: afristock
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # mot de passe de la base Render
      - key: JAVA_VERSION
        value: "17"

databases:
  - name: afristock-db
    plan: free
    databaseName: afristock
    user: afristock
