# Profil PROD pour Render
# Render fournit DATABASE_URL au format postgres://user:pass@host:port/db
# mais le driver JDBC exige jdbc:postgresql://...
# Solution : sur la page de la base Render, copier la "JDBC Connection String"
# et la mettre dans la variable JDBC_DATABASE_URL du web service.

# Spring Boot lit directement les variables SPRING_DATASOURCE_URL / USERNAME / PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.thymeleaf.cache=true

logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
